<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tech Store</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --whatsapp: #25D366;
            --whatsapp-hover: #1da851;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Header & Navbar */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo i { color: var(--primary); }

        .cart-icon-btn {
            position: relative;
            background: #f1f5f9;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .cart-icon-btn:hover { background: #e2e8f0; }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .hero-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .hero-banner h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero-banner p { color: #94a3b8; font-size: 1rem; }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .card-buttons {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-outline {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-outline:hover { background: #e2e8f0; }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
        }

        .btn-whatsapp:hover { background: var(--whatsapp-hover); }

        /* Slide Drawer / Modal background */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .overlay.active { display: block; }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: white;
            z-index: 300;
            box-shadow: var(--shadow-lg);
            transition: right 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active { right: 0; }

        .drawer-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            padding: 1rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .cart-item-details { flex-grow: 1; }
        .cart-item-title { font-weight: 600; font-size: 0.95rem; }
        .cart-item-price { color: var(--primary); font-weight: 700; margin-top: 4px; }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #f8fafc;
            cursor: pointer;
        }

        .drawer-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: #f8fafc;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* Checkout Modal */
        .checkout-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: var(--radius);
            z-index: 400;
            display: none;
            opacity: 0;
            transition: all 0.2s ease-in-out;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .checkout-modal.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkout-form {
            padding: 1.25rem;
            display: flex;
            flex-direction: flex-direction;
            gap: 1rem;
            flex-direction: column;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        @media (max-width: 480px) {
            .hero-banner { padding: 1.5rem 1rem; }
            .hero-banner h1 { font-size: 1.5rem; }
            .card-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <a href="#" class="brand-logo">
                <i class="fa-solid fa-bolt"></i> TechStore
            </a>
            <button class="cart-icon-btn" onclick="toggleCartDrawer()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-banner">
            <h1>Upgrade Your Tech Today</h1>
            <p>Fast delivery & order directly via WhatsApp</p>
        </div>

        <h2 style="margin-bottom: 1.5rem; font-size: 1.3rem;">Featured Products</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Overlay background for Drawers/Modals -->
    <div class="overlay" id="overlay" onclick="closeAllModals()"></div>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3>Your Cart</h3>
            <button class="close-btn" onclick="toggleCartDrawer()">&times;</button>
        </div>
        <div class="cart-items-list" id="cartItemsContainer">
            <!-- Dynamic Cart Items -->
        </div>
        <div class="drawer-footer">
            <div class="cart-total">
                <span>Total Amount:</span>
                <span id="cartTotalDisplay">$0</span>
            </div>
            <button class="btn btn-primary" onclick="openCheckoutModal()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="modal-header">
            <h3>Customer Details</h3>
            <button class="close-btn" onclick="closeCheckoutModal()">&times;</button>
        </div>
        <form class="checkout-form" id="checkoutForm" onsubmit="submitOrder(event)">
            <div class="form-group">
                <label for="custName"><i class="fa-solid fa-user"></i> Full Name *</label>
                <input type="text" id="custName" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label for="custPhone"><i class="fa-solid fa-phone"></i> Phone Number *</label>
                <input type="tel" id="custPhone" placeholder="e.g. +1 234 567 8900" required>
            </div>
            <div class="form-group">
                <label for="custAddress"><i class="fa-solid fa-location-dot"></i> Delivery Address *</label>
                <textarea id="custAddress" rows="3" placeholder="Street, City, Postal Code" required></textarea>
            </div>
            <button type="submit" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Place Order via WhatsApp
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Set your WhatsApp phone number here (include country code without + or dashes)
        const MERCHANT_PHONE = "1234567890"; // E.g., 1234567890 for US or 919876543210 for India

        // Sample Product Data
        const products = [
            {
                id: 1,
                name: "Wireless ANC Headphones",
                price: 99,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=80"
            },
            {
                id: 2,
                name: "Smart Watch Series 7",
                price: 149,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80"
            },
            {
                id: 3,
                name: "Ergonomic Mechanical Keyboard",
                price: 79,
                image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&auto=format&fit=crop&q=80"
            },
            {
                id: 4,
                name: "Minimalist Gaming Mouse",
                price: 49,
                image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500&auto=format&fit=crop&q=80"
            }
        ];

        let cart = [];

        // Render Products to Grid
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">$${product.price}</div>
                        <div class="card-buttons">
                            <button class="btn btn-outline" onclick="addToCart(${product.id})">
                                <i class="fa-solid fa-cart-plus"></i> Add
                            </button>
                            <button class="btn btn-primary" onclick="buyNow(${product.id})">
                                Buy Now
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart Logic
        function addToCart(productId) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                const product = products.find(p => p.id === productId);
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // Buy Now Logic
        function buyNow(productId) {
            addToCart(productId);
            openCheckoutModal();
        }

        // Change Quantity
        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartUI();
        }

        // Update Cart UI Components
        function updateCartUI() {
            // Update badge count
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartBadge').innerText = totalItems;

            // Update Drawer items list
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top:2rem;">Your cart is empty.</p>`;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-img">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">$${item.price * item.quantity}</div>
                            <div class="quantity-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Update Total Price
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cartTotalDisplay').innerText = `$${totalAmount}`;
        }

        // Modals Controls
        function toggleCartDrawer() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            document.getElementById('cartDrawer').classList.remove('active');
            document.getElementById('checkoutModal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function closeAllModals() {
            document.getElementById('cartDrawer').classList.remove('active');
            document.getElementById('checkoutModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // Submit Order and Trigger WhatsApp
        function submitOrder(event) {
            event.preventDefault();

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            // Construct WhatsApp Message
            let textMessage = `🛒 *NEW ORDER PLACED*\n\n`;
            textMessage += `👤 *Customer Details:*\n`;
            textMessage += `• *Name:* ${name}\n`;
            textMessage += `• *Phone:* ${phone}\n`;
            textMessage += `• *Address:* ${address}\n\n`;

            textMessage += `📦 *Order Items:*\n`;
            cart.forEach((item, index) => {
                textMessage += `${index + 1}. ${item.name} (x${item.quantity}) - $${item.price * item.quantity}\n`;
            });

            textMessage += `\n💰 *Total Amount:* $${totalAmount}\n`;
            textMessage += `\nPlease confirm my order. Thank you!`;

            // Open WhatsApp with pre-filled text
            const encodedMessage = encodeURIComponent(textMessage);
            const whatsappURL = `https://wa.me/${MERCHANT_PHONE}?text=${encodedMessage}`;

            window.open(whatsappURL, '_blank');

            // Reset cart & close modals
            cart = [];
            updateCartUI();
            closeAllModals();
            document.getElementById('checkoutForm').reset();
        }

        // Initial Load
        renderProducts();
    </script>
</body>
</html>
